catalogMode: prefer
minimumReleaseAge: 1
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
# Nuxt's Vue JSX builder reaches this established semver release through Babel. It predates npm
# trusted publishing and has no equivalent trust evidence, so pnpm otherwise rejects every script run.
trustPolicyExclude:
  - semver@6.3.1

fetchTimeout: 600000
shellEmulator: true

packages:
  - packages/**
  - apps/**
  - plugins/**
  - '!**/dist/**'

overrides:
  array-flatten: npm:@nolyfill/array-flatten@^1.0.44
  axios: npm:feaxios@^0.0.23
  is-core-module: npm:@nolyfill/is-core-module@^1.0.39
  isarray: npm:@nolyfill/isarray@^1.0.44
  onnxruntime-web: npm:onnxruntime-web@^1.31.1
  safe-buffer: npm:@nolyfill/safe-buffer@^1.0.44
  safer-buffer: npm:@nolyfill/safer-buffer@^1.0.44
  side-channel: npm:@nolyfill/side-channel@^1.0.44
  string.prototype.matchall: npm:@nolyfill/string.prototype.matchall@^1.0.44
  # TODO:
  # Oops! Something went wrong! :(
  #
  # eslint: 10.5.0
  #
  # TypeError: Cannot read properties of undefined (reading 'FunctionType')
  #     at ./node_modules/.pnpm/eslint-plugin-sonarjs@4.1.0_eslint@10.5.0_jiti@2.7.0_/node_modules/eslint-plugin-sonarjs/cjs/S2201/rule.js:244:62
  typescript: '^6.0.3'

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  simple-git-hooks: true

catalog:
  '@agentclientprotocol/sdk': ^2.4.0
  '@antfu/eslint-config': ^10.0.0
  '@arethetypeswrong/core': ^0.18.5
  '@clack/prompts': ^1.8.1
  '@earendil-works/pi-agent-core': ^1.5.0
  '@earendil-works/pi-ai': ^1.5.0
  '@modelcontextprotocol/sdk': ^1.32.2
  '@moeru/eslint-config': ^0.1.0-beta.20
  '@moeru/std': ^0.1.0-beta.20
  '@openai/codex-sdk': ^0.144.6
  '@package-json/types': ^0.0.13
  '@pnpm/find-workspace-dir': ^1000.1.5
  '@smithy/node-http-handler': ^4.14.2
  '@types/node': ^26.6.6
  '@types/proper-lockfile': 4.1.4
  # Pinned, not caret-ranged: this is the VS Code API surface the extension is allowed to use, and
  # it has to stay equal to `engines.vscode` in apps/vscode. A caret would let the type checker
  # accept APIs that the oldest supported VS Code does not ship.
  '@types/vscode': 1.91.0
  '@valibot/to-json-schema': ^1.8.0
  '@xsai/generate-text': ^0.5.1
  '@xsai/shared-chat': ^0.5.1
  '@xsai/stream-text': ^0.5.1
  '@xsai/tool': ^0.5.1
  apeira: ^0.0.8
  bumpp: ^12.3.0
  c12: ^4.0.0-rc.4
  cac: ^7.1.0
  chokidar: ^6.0.0
  cli-spinners: ^3.4.0
  cspell: ^10.4.0
  date-fns: ^4.4.0
  diff: ^9.0.0
  doctoc: ^2.5.0
  # Held at 3.x: only here to satisfy the optional `effect` peer of `xsschema` (`^3.16.0`) in the
  # binary build. Bump together with `xsschema` accepting 4.x.
  effect: ^3.22.4
  es-toolkit: ^1.53.1
  eslint: ^10.14.0
  eslint-plugin-oxlint: ^1.90.0
  fast-string-truncated-width: ^3.0.3
  fast-string-width: ^3.0.2
  gitignore-fs: ^2.2.3
  h3: 2.0.1-rc.25
  jiti: ^2.7.0
  knip: ^6.44.1
  local-pkg: ^2.0.0
  minimatch: ^10.2.6
  mlly: ^1.8.2
  nano-staged: ^1.0.2
  ofetch: ^1.5.1
  oxc-minify: ^0.157.0
  oxc-parser: ^0.157.0
  oxlint: ^1.91.0
  pathe: ^2.0.3
  proper-lockfile: 4.1.2
  publint: ^0.3.25
  resolve.exports: 2.0.3
  rollup: ^4.67.5
  simple-git-hooks: ^2.14.0
  smol-toml: ^1.9.1
  sury: ^11.1.0
  table: ^6.10.1
  tar-stream: ^3.2.2
  taze: ^21.3.0
  tinyexec: ^1.3.1
  tinyglobby: ^0.2.17
  tinyrainbow: ^3.2.0
  tree-sitter-wasms: ^0.1.13
  tsdown: ^0.23.5
  tsx: ^4.23.15
  turbo: ^2.11.10
  typescript: ^6.0.3
  unplugin-raw: ^0.8.0
  unplugin-unused: ^0.6.0
  unrun: ^0.3.1

  valibot: ^1.5.0
  vite: ^8.3.6
  vscode-languageclient: ^11.0.0
  vscode-languageserver: ^11.0.0
  # Held at 0.24.x together with `tree-sitter-wasms`: 0.25 and later reject the prebuilt 0.1.x
  # grammars. See `packages/languages/src/grammar.ts` before bumping either one.
  web-tree-sitter: ~0.24.7
  xdg-basedir: ^5.1.0
  zod: ^4.6.7

catalogs:
  vitest:
    '@vitest/coverage-v8': ^5.1.0
    vitest: ^5.1.0

permissions:
  taze:
    skills: true

skills:
  dirs:
    - .agents/skills
    - .claude/skills
